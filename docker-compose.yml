services:

  api:

    build: .

    container_name: primus-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    restart: unless-stopped

  worker:

    build: .

    container_name: primus-worker

    command: celery -A app.core.celery_app worker --loglevel=info

    env_file:
      - .env

    restart: unless-stopped

  beat:

    build: .

    container_name: primus-beat

    command: celery -A app.core.celery_app beat --loglevel=info

    env_file:
      - .env

    restart: unless-stopped