version: "3.9"

# Postgres is no longer run locally here -- this project uses Supabase's
# managed Postgres instead (see SETUP.md, section 3). Only Redis (used for
# Celery/caching, see app/config.py's redis_url / celery_broker_url) still
# runs locally.
#
# If you'd rather self-host Postgres instead of using Supabase, uncomment
# the `db` service below and point DATABASE_URL / DATABASE_URL_SYNC in your
# .env back at localhost:5432.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

