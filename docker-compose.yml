services:

  api:

    build: .

    container_name: primus-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:

    image: redis:7-alpine

    container_name: primus-redis

    ports:
      - "6380:6379"

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  worker:

    build: .

    container_name: primus-worker

    command: celery -A app.core.celery_app worker --loglevel=info

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  beat:

    build: .

    container_name: primus-beat

    command: celery -A app.core.celery_app beat --loglevel=info

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped